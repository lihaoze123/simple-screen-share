services:
  mediamtx:
    image: docker.io/bluenviron/mediamtx:1.21.2
    container_name: lan-screenshare-mediamtx
    network_mode: host  # Linux only: makes local-network WebRTC ICE simpler
    restart: unless-stopped
    environment:
      MTX_RTSP: "false"
      MTX_RTMP: "false"
      MTX_HLS: "false"
      MTX_SRT: "false"
      MTX_MOQ: "true"
      MTX_WEBRTCADDRESS: ":8889"
      MTX_MOQHTTP2ADDRESS: ":8892"
      MTX_MOQHTTP3ADDRESS: ":8892"
      MTX_MOQQUICADDRESS: "127.0.0.1:8893"
      MTX_MOQSERVERKEY: "auto.key"
      MTX_MOQSERVERCERT: "auto.crt"

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: lan-screenshare-caddy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      LAN_HOST: "${LAN_HOST:?Set LAN_HOST to the Linux LAN IP in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
